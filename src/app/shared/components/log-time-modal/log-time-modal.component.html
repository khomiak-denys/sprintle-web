@if (isOpen) {
  <div class="modal-overlay" (click)="onClose()"></div>
  <div class="azure-modal" role="dialog" aria-labelledby="modal-time-title">
    <div class="modal-header">
      <h2 id="modal-time-title" class="modal-title">Log Time on Work Item</h2>
      <button type="button" class="modal-close-btn" (click)="onClose()" aria-label="Close dialog">
        ✕
      </button>
    </div>

    <form [formGroup]="logTimeForm" (ngSubmit)="onSubmit()" class="azure-modal-form">
      <div class="form-field">
        <label for="log-minutes">Duration <span class="required">*</span></label>
        <select id="log-minutes" formControlName="minutesSpent" class="azure-select">
          @for (preset of timePresets; track preset.minutes) {
            <option [ngValue]="preset.minutes">{{ preset.description }}</option>
          }
        </select>
        <div class="field-error-slot" aria-live="polite">
          @if (
            logTimeForm.get('minutesSpent')?.touched &&
            logTimeForm.get('minutesSpent')?.errors?.['required']
          ) {
            <span class="field-error">Duration is required.</span>
          }
        </div>
      </div>

      <div class="form-field">
        <label for="log-date">Date <span class="required">*</span></label>
        <input id="log-date" type="date" formControlName="loggedDate" class="azure-input" />
      </div>

      <div class="form-field">
        <label for="log-desc">Work Description</label>
        <textarea
          id="log-desc"
          rows="3"
          formControlName="description"
          placeholder="Details of the work completed during this session..."
          class="azure-textarea"
        ></textarea>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="onClose()"
          [disabled]="isSubmitting"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="logTimeForm.invalid || isSubmitting"
        >
          @if (isSubmitting) {
            <span class="btn-spinner"></span>
            <span>Recording...</span>
          } @else {
            <span>Record Time</span>
          }
        </button>
      </div>
    </form>
  </div>
}
